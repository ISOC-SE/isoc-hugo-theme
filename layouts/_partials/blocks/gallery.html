{{- $b := .block -}}
<section class="block block-gallery{{ with $b.background }} band band--{{ . }}{{ end }}">
  <div class="wrap wrap--1180 reveal">
    {{- with $b.title }}
    <h2 class="block__title">{{ . }}</h2>
    {{- end }}
    {{ partial "gallery.html" (dict "page" .page "images" ($b.images | default slice)) }}
  </div>
</section>
