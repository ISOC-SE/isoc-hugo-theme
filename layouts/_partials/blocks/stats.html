{{- $b := .block -}}
<section class="block block-stats{{ with $b.background }} band band--{{ . }}{{ end }}">
  <div class="wrap wrap--1180 reveal">
    {{- with $b.title }}
    <h2 class="block__title">{{ . }}</h2>
    {{- end }}
    {{ partial "stats.html" ($b.items | default slice) }}
  </div>
</section>
