name: Checks

# Runs scripts/check.sh on pull requests. Builds and asserts only; never deploys.
# Uses pull_request (not pull_request_target), so fork PRs get a read-only token
# and no secrets.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.167.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Hugo (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSLO "$base/$deb"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${deb}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          sudo dpkg -i "$deb"
          hugo version

      - name: Check theme
        run: scripts/check.sh
