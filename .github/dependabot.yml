# Keeps the SHA-pinned GitHub Actions up to date (the version comment is updated too).
# Hugo is pinned by HUGO_VERSION in the workflows and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for all action updates instead of one per action. The Pages
    # actions (configure/upload/deploy) only run on main, so they are best
    # updated and verified together.
    groups:
      github-actions:
        patterns: ["*"]
